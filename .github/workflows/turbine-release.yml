name: Release Turbine sing-box

on:
  push:
    tags:
      - 'turbine-v*'

permissions:
  contents: write

# --------------------------------------------------
# Changelog:
#   - hysteria2 protocol added http auth support
#   - v2ray api ignore users, default to all users
#   - hysteria2 user bandwidth limiting added (fixed + dynamic token bucket at application layer)
#   - tuic protocol added http auth support
#   - tuic user bandwidth limiting added (fixed + dynamic token bucket at application layer)
#   - experimental turbine connection guard with confidence-based routing (acceleration / proxy / reject)
#   - Redis storage for owner session, allow-list and IP decisions (mock mode supported)
#   - destination IP/CIDR blacklist
#   - EDNS session option injection for DNS-over-UDP (default option code 65001)
#   - DNS-over-UDP TCP length prefix strip/reframe with buffer growth for tight/over-cap packets
#   - DNS resolver bypass with ip:port matching
#   - tunnel ID tracking and structured session logging
# --------------------------------------------------
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: turbine
          path: sing-box
          fetch-depth: 0

      - name: Check sing-quic
        uses: actions/checkout@v4
        with:
          repository: AeroCore-IO/sing-quic
          ref: turbine
          path: sing-quic

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.9
          cache-dependency-path: sing-box/go.sum # Disabled as go.sum might not be present

      - name: Build binaries
        working-directory: sing-box
        run: |
          make ci_build TAGS="with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_v2ray_api,with_grpc"

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sing-box/sing-box
          draft: false
          prerelease: false
          generate_release_notes: true
