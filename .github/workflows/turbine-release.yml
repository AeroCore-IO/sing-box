name: Release Turbine sing-box

on:
  push:
    tags:
      - 'turbine-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature-http-auth
          path: sing-box

      - name: Check sing-quic
        uses: actions/checkout@v4
        with:
          repository: AeroCore-IO/sing-quic
          ref: feature-http-auth
          path: sing-quic

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sing-box/go.sum # Disabled as go.sum might not be present

      - name: Build binaries
        working-directory: sing-box
        run: |
          make ci_build

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sing-box/sing-box
          draft: false
          prerelease: false
          generate_release_notes: true
